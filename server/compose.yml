version: "3.8"
services:
  mcp:
    build: .
    ports:
      - "3000:3000"
    environment:
      - TRANSPORT=http
      - MONGO_URL=mongodb://mongodb:27017/mcp
    networks:
      - mcp
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mcp
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:

networks:
  mcp:
    driver: bridge
